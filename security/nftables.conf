#!/usr/bin/nft -f
# Theme 9: host firewall, default deny inbound. Installed to /etc/nftables.conf
# and loaded by nftables.service. Inspect with: sudo nft list ruleset
#
# Replaces arch-config's ufw on this distro: install.sh disables ufw because
# two firewalls would both have to accept a packet (a drop in any base chain
# wins), which makes the policy hard to reason about.

flush ruleset

define ssh_port = 22

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept comment "replies to our traffic"
        ct state invalid drop
        iif "lo" accept

        # ICMP: ping and the IPv6 control messages IPv6 cannot work without.
        ip protocol icmp icmp type echo-request limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, nd-neighbor-solicit,
            nd-neighbor-advert, nd-router-advert } accept

        # SSH, rate limited per new connection to slow down brute force.
        tcp dport $ssh_port ct state new limit rate 10/minute accept

        limit rate 5/minute log prefix "nft-drop: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
