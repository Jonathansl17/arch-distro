# Theme 9: SSH hardening. Installed to /etc/ssh/sshd_config.d/ (Arch's
# sshd_config includes that directory). Effective values: sudo sshd -T
#
# Copy your public key first (ssh-copy-id) or you will be locked out of SSH;
# the VM console still works.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowGroups wheel
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
