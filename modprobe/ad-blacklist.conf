# Theme 8: modules this distro never wants loaded.
# Installed to /usr/lib/modprobe.d/. Verify after reboot: lsmod | grep -E 'pcspkr|joydev'
#
# pcspkr: drives the PC speaker beep. Useless on a VM or laptop and noisy on
# every tab-completion miss in the TTY.
blacklist pcspkr
# joydev: legacy /dev/input/js* joystick interface. Nothing here uses it;
# modern software reads /dev/input/event* through evdev instead.
blacklist joydev
