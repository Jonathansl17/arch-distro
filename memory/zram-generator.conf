# zram swap device (theme 2). Installed to /etc/systemd/zram-generator.conf.
# Half of RAM capped at 4 GiB: zstd usually compresses anonymous pages ~3:1, so
# 4 GiB of zram costs ~1.3 GiB of real RAM when full.
# swap-priority 100 > swapfile priority 10: the kernel fills the higher
# priority device first, so pages go to compressed RAM before touching disk.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
